<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<title>Шахматы со стендами из JoJo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="statusMain">Загрузка…</div>
    <div id="statusSub"></div>
  </header>

  <main id="boardWrap">
    <div id="board">
      <div id="cells" class="layer"></div>
      <div id="pieces" class="layer"></div>
    </div>
  </main>

  <div id="controls">
    <button id="btnStand" class="btn stand-btn hidden">Стенд</button>
    <button id="btnHint" class="btn">Подсказка</button>
    <button id="btnNew" class="btn">Новая партия</button>
  </div>

  <div id="log" aria-live="polite"></div>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="chess.js"></script>
<script src="stands.js"></script>
<script src="ai.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
